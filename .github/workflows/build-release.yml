name: Build & Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Needed so the job can push the version-bump commit and create the release.
permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Increment version
        if: env.IS_RELEASE == 'true'
        run: |
          OLD_VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          OLD_CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*')

          IFS='.' read -r major minor patch <<< "$OLD_VERSION"
          NEW_VERSION="$major.$minor.$((patch + 1))"
          NEW_CODE=$((OLD_CODE + 1))

          sed -i "s/versionCode = $OLD_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"$OLD_VERSION\"/versionName = \"$NEW_VERSION\"/" app/build.gradle.kts

          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$NEW_CODE" >> $GITHUB_ENV

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Signing is optional: it only runs when the SIGNING_KEY secret is configured.
      - name: Sign APK
        if: env.IS_RELEASE == 'true' && env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare release APK
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p release
          APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          [ -n "$APK" ] || APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "release/InterviewPrepLab-${VERSION}.apk"

      - name: Commit and push version bump
        if: env.IS_RELEASE == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Create Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Interview Prep Lab v${{ env.VERSION }}
          body: |
            ## Interview Prep Lab v${{ env.VERSION }}

            **Version Code:** ${{ env.VERSION_CODE }}

            **Installation:**
            1. Download `InterviewPrepLab-${{ env.VERSION }}.apk` below
            2. Enable "Install unknown apps" in Android settings
            3. Tap the APK to install
            4. To update an existing install, tap the new APK to upgrade

            **Features:**
            - Interactive DSA visualizations with smooth animations
            - Frame-by-frame step-through of algorithms
            - Playback controls (play/pause/step/scrub/speed)
            - Narration explaining each step
            - Statistics tracking (comparisons, swaps, etc.)
          files: release/InterviewPrepLab-${{ env.VERSION }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
